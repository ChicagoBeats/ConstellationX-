
name: ConstellationX Vocal - Build VST3

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Windows VST3
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -A x64

      - name: Build VST3 Plugin
        run: cmake --build build --config Release --parallel

      - name: Upload VST3 Plugin
        uses: actions/upload-artifact@v4
        with:
          name: ConstellationX-Vocal-VST3
          path: build/ConstellationXVocal_artefacts/Release/VST3/ConstellationX Vocal.vst3

      - name: Upload Standalone Plugin
        uses: actions/upload-artifact@v4
        with:
          name: ConstellationX-Vocal-Standalone
          path: build/ConstellationXVocal_artefacts/Release/Standalone/
          if-no-files-found: ignore
